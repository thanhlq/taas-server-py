[project]
name = "ews_api"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  # Core modules (workspace)
  'foundation',
  'ews',
  'http_fastapi',
  'db',
  'iam',
  'iam_keycloak',
  'resiliant',
  'store_redis',
  'messaging_faststream',
  'fastapi==0.136.1',
  'uvicorn==0.34.0',
  'redis==7.4.0',
  "python-multipart>=0.0.32",
  "blob-service",
]

[project.scripts]
ews_api = "ews_api.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
blob-service = { workspace = true }
