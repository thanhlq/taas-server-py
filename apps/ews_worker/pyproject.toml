[project]
name = "ews_worker"
version = "0.2.0"
description = "EWS background worker: Kafka consumer, event processing, outbox relay, File Manager pipeline."
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanhlq@msn.com" }
]
requires-python = ">=3.14"
dependencies = [
    # Core modules (workspace)
    'foundation',
    'db',
    'ews',
    'blob_service',
    'store_redis',
    'messaging_faststream',
    'resiliant',
    # Runtime
    'aiohttp>=3.9.0',
    'redis==7.4.0',
]

[project.scripts]
ews_worker = "ews_worker.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
