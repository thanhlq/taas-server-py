[project]
name = "blob-azure"
version = "0.1.0"
description = "Azure Blob Storage adapter (aio + SAS) for foundation.blob"
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanh@floin.com" }
]
requires-python = ">=3.14"
dependencies = [
    'foundation',
    "azure-storage-blob[aio]>=12.20.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
