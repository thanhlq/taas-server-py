[project]
name = "block-kaspa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanh@msn.com" }
]
requires-python = ">=3.14"
dependencies = [
    "platform_core",
    "kaspa>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Async tests/fixtures run without explicit @pytest.mark.asyncio markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Put `src` on sys.path so `block_kaspa` imports, and `.` so `tests` is importable.
pythonpath = ["src", "."]
python_classes = "Test*"
