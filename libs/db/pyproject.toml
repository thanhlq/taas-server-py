[project]
name = "db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanhlq@msn.com" }
]
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy[cryptography]==1.11.0",
    "alembic>=1.18.5",
    'foundation',
    "psycopg[binary]>=3.2",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.pytest.ini_options]
# Async tests/fixtures run without explicit @pytest.mark.asyncio markers.
asyncio_mode = "auto"


[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
