[project]
name = "ews"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanhlq@msn.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "foundation",
    "httpx>=0.28.1",
    "msgspec==0.21.1",
    "pillow>=12.3.0",
    "pydantic==2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Async tests/fixtures run without explicit @pytest.mark.asyncio markers; one event loop per session
# (the platform DB engine is process-wide).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests/unit"]
