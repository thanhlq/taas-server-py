[project]
name = "iam_keycloak"
version = "0.1.0"
description = "The iam implementation using keycloak"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "foundation",

    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "python-keycloak==7.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_keycloak"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.0.0",
    "httpx>=0.24.0",
]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
asyncio_mode = "auto"
