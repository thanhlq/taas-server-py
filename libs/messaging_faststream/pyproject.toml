[project]
name = "messaging_faststream"
version = "0.1.0"
description = "FastStream messaging utilities"
authors = [
    {name = "EMSA Technology", email = "dev@emsa-technology.com"}
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging_faststream"]

requires-python = ">=3.14"
dependencies = [
    # 🌐 Web Framework & Server
    "fastapi==0.128.6",
    "fastapi-cache2==0.2.2",

    # Message queuing and streaming
    "faststream[kafka]==0.6.7",

    # �️ Confluent Schema Registry (Avro support)
    # Pure-Python async HTTP client — no librdkafka required
    "httpx>=0.27.0",
    "fastavro>=1.9.0",
    "python-schema-registry-client[faust]==2.4.3",

    # �🔐 Security & Authentication
    "passlib==1.7.4",
    "pyjwt==2.10.0",
    "bcrypt==4.3.0",

    # ✅ Validation & Data Models
    "pydantic==2.13.4",
    "pydantic_settings==2.14.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.0.0",
    "respx>=0.21.0",
    "mypy"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests requiring external services (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
