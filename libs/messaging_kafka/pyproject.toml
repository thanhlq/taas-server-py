[project]
name = "messaging_kafka"
version = "0.1.0"
description = "Kafka messaging utilities"
readme = "README.md"
authors = [
    { name = "EMSA Technology", email = "dev@emsa-technology.com" }
]
requires-python = ">=3.14"
dependencies = [
    # Workspace modules
    "platform_core",

    # Message queuing and streaming
    "aiokafka==0.14.0",

    # ✅ Validation & Data Models
    "pydantic==2.13.4",
    "pydantic_settings==2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.0.0",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests requiring external services (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
