[project]
name = "resiliant"
version = "0.1.0"
description = "Durable resilience patterns (outboxes, DLQ, idempotency, sagas, schedules) and their models"
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanh@floin.com" }
]
requires-python = ">=3.14"
dependencies = [
    'foundation',
    # Owns its SQLAlchemy models (resiliant.models); libs/db only runs the migrations.
    'advanced_alchemy',
    'croniter>=3.0.0',
    # Retry policies (resiliant.retry) and the Redis idempotency store.
    "tenacity>=9.0.0",
    # Redis idempotency store (client built via store_redis: single / sentinel / cluster).
    'store-redis',
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
]

[tool.pytest.ini_options]
# Async tests/fixtures run without explicit @pytest.mark.asyncio markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Put the lib root on sys.path so `tests` is importable.
pythonpath = ["."]
testpaths = ["tests"]
