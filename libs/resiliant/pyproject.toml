[project]
name = "resiliant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thanh LE", email = "thanh@floin.com" }
]
requires-python = ">=3.14"
dependencies = [
    'foundation',
    'db',
    'advanced_alchemy',
    'croniter>=3.0.0',
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
]

[tool.pytest.ini_options]
# Async tests/fixtures run without explicit @pytest.mark.asyncio markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Put the lib root on sys.path so `tests` is importable.
pythonpath = ["."]
testpaths = ["tests"]
